<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2ea274" />
    <title>香港借记卡提款收费对比</title>
    <meta
      name="description"
      content="香港各大银行借记卡 / 提款卡在香港银通、汇丰恒生、澳门、内地及境外 ATM 的提款收费一览。按银行、按 ATM 类型查询，或看完整对比表。"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="香港借记卡提款收费对比" />
    <meta
      property="og:description"
      content="香港各大银行借记卡在境内外 ATM 的提款收费一览，支持按银行、按 ATM 类型查询与完整对比表。"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // 避免主题闪烁：首帧前根据 localStorage / 系统偏好设置 .dark / .light
      (function () {
        try {
          var m = localStorage.getItem('theme') || 'auto'
          var dark =
            m === 'dark' ||
            (m === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var r = document.documentElement
          r.classList.add(dark ? 'dark' : 'light')
          r.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
